<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas  📋</title>
    <link rel="stylesheet" href="estilo_tabla.css">
    
</head>

<body>
    <main>
        <table>
            <caption>Inventario de Productos </caption>
            <colgroup>
                <col class="col-codigo">
                <col class="col-producto">
                <col class="col-precio">
            </colgroup>

            <thead>
                <tr>
                    <th scope="col"> Código</th>
                    <th scope="col"> Producto</th>
                    <th scope="col"> Precio</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td> 001</td>
                    <td> Teclado SCORPO 580 </td>
                    <td> $250.000</td>
                </tr>
                <tr>
                    <td> 002</td>
                    <td> Pantalla LG 4k curve </td>
                    <td> $450.000</td>
                </tr>
                <tr>
                    <td> 003</td>
                    <td> Mouse Aws </td>
                    <td> $120.000</td>
                </tr>

            </tbody>


            <tfoot>
                <tr>
                    <td colspan="2"><strong>Total Inventario</strong></td>
                    <td>820.000</td>
                </tr>

            </tfoot>

         </table>
    
    </main>

</body>
</html>
